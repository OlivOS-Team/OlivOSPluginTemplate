[build-system]
requires = ["setuptools>=63.2.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "olivos-plugin-OlivOSPluginTemplate"
version = "1.0.0"
description = "这是OlivOS官方插件模板，而这是一条有关插件的简介。"
readme = "README.md"
requires-python = ">=3.7"
authors = []
license = {text = "AGPLv3 License"}
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "olivos",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4,<9",
    "pytest-cov>=5,<7",
]

[project.urls]
Repository = "https://github.com/OlivOS-Team/OlivOSPluginTemplate"
Issues = "https://github.com/OlivOS-Team/OlivOSPluginTemplate/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["OlivOSPluginTemplate"]
branch = true
relative_files = true

[tool.coverage.report]
precision = 2
show_missing = true

[tool.coverage.html]
directory = "test-results/html"
